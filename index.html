    // --- Network visualization ---

    const nodeColors = {
      institutions: '#7a8490',
      people: '#e8a0b0',
      projects: '#e8a840',
      initiatives: '#4a9e6a',
      courses: '#7b68ae',
      events: '#c06050',
      domains: '#999999',
      places: '#2a9d8f',
      publications: '#3a7ca5',
      vectors: '#7ccf9e',
      deltas: '#d4b560'
    };

    // buildGraphData is now provided by compass-data.js

    // Default entity types shown in network viz (override with ?show=type1,type2 in URL)
    const networkDefaultOn = new Set(['institutions', 'people', 'projects', 'initiatives', 'courses', 'events']);
    const networkAllTypes = ['institutions', 'people', 'projects', 'initiatives', 'courses', 'events', 'domains', 'places', 'publications', 'vectors', 'deltas'];

    function loadNetwork() {
      clearOrientationRotator();
      currentDoc = 'network';
      tocEl.classList.remove('visible');
      docTocEl.classList.remove('visible');
      layoutEl.classList.remove('has-toc');

      // Parse ?show= and ?connected= from hash (e.g. #network?show=people,projects&connected=domains)
      const hashQuery = location.hash.split('?')[1];
      const params = hashQuery ? new URLSearchParams(hashQuery) : null;
      const showParam = params && params.get('show');
      const connParam = params && params.get('connected');
      let typeStates; // map of type -> 'on'|'connected'|'off'
      if (showParam || connParam) {
        const onSet = showParam ? new Set(showParam.split(',').filter(t => networkAllTypes.includes(t))) : new Set();
        const connSet = connParam ? new Set(connParam.split(',').filter(t => networkAllTypes.includes(t))) : new Set();
        typeStates = {};
        networkAllTypes.forEach(t => { typeStates[t] = onSet.has(t) ? 'on' : connSet.has(t) ? 'connected' : 'off'; });
      } else {
        typeStates = {};
        networkAllTypes.forEach(t => { typeStates[t] = networkDefaultOn.has(t) ? 'on' : 'off'; });
      }

      const filterButtons = networkAllTypes.map(t => {
        const cls = typeStates[t] === 'on' ? '' : typeStates[t] === 'connected' ? ' connected' : ' off';
        const label = t.charAt(0).toUpperCase() + t.slice(1);
        return `<button class="network-toggle${cls}" data-type="${t}"><span class="toggle-dot" style="background: ${nodeColors[t]}"></span> ${label}</button>`;
      }).join('\n              ');

      contentEl.innerHTML = `
        <div class="network-page">
          <div class="network-controls">
            <div class="network-filters" id="network-filters">
              ${filterButtons}
            </div>
          </div>
          <div class="network-container" id="network-container"></div>
          <div class="network-detail" id="network-detail"></div>
          <div class="network-controls-hint" id="network-controls-hint">
            <div><kbd>Left drag</kbd> Pan</div>
            <div><kbd>Right drag</kbd> Orbit</div>
            <div><kbd>Scroll</kbd> Zoom</div>
            <div><kbd>Click</kbd> Select node</div>
          </div>
        </div>
      `;

      updateActiveNavLink('network');
      window.scrollTo(0, 0);

      ensureStore().then(() => {
          const graphData = buildGraphData();
          const container = document.getElementById('network-container');
          if (!container) return;

          const graph = ForceGraph3D()(container)
            .graphData(graphData)
            .nodeId('id')
            .nodeLabel(() => '')
            .nodeColor(node => {
              if (!window._hoveredNodeId || (window._connectedNodeIds && window._connectedNodeIds.has(node.id))) return nodeColors[node.type] || '#999';
              return '#2a2a2a';
            })
            .nodeVal('val')
            .nodeRelSize(3)
            .nodeOpacity(0.9)
            .nodeThreeObjectExtend(true)
            .nodeThreeObject(node => {
              const sprite = new SpriteText(node.label, 3.5, '#ffffff');
              sprite.material.depthWrite = false;
              sprite.material.depthTest = false;
              sprite.material.opacity = 0.55;
              sprite.material.transparent = true;
              sprite.renderOrder = 1;
              node.__labelSprite = sprite;
              node.__labelBaseScale = { x: sprite.scale.x, y: sprite.scale.y, z: sprite.scale.z };
              return sprite;
            })
            .onNodeHover(node => {
              window._hoveredNode = node;
              // Build set of connected node IDs
              window._hoveredNodeId = node ? node.id : null;
              window._connectedNodeIds = new Set();
              if (node) {
                window._connectedNodeIds.add(node.id);
                graph.graphData().links.forEach(l => {
                  const src = typeof l.source === 'object' ? l.source.id : l.source;
                  const tgt = typeof l.target === 'object' ? l.target.id : l.target;
                  if (src === node.id) window._connectedNodeIds.add(tgt);
                  if (tgt === node.id) window._connectedNodeIds.add(src);
                });
              }
              container.style.cursor = node ? 'pointer' : 'default';
            })
            .linkColor(() => 'rgba(255,255,255,0.15)')
            .linkWidth(0.3)
            .backgroundColor('#1e1e1e')
            .onNodeClick(node => {
              if (window._selectedNodeId === node.id) {
                deselectNode();
              } else {
                selectNode(node);
              }
            })
            .onBackgroundClick(() => {
              if (window._selectedNodeId) deselectNode();
            });

          // Soften repulsion so disconnected nodes don't fly far away
          graph.d3Force('charge').strength(-30);
          graph.d3Force('center').strength(0.15);
          window._d3ForceCenter = graph.d3Force('center');
          window._d3DefaultLinkStrength = graph.d3Force('link').strength();

          // Fit all nodes in view early
          setTimeout(() => graph.zoomToFit(400, 40), 500);

          // Camera: left-drag = pan, right-drag = orbit, scroll = zoom
          const controls = graph.controls();
          controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
          controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
          controls.panSpeed = 0.1;

          // Keep labels slightly below nodes relative to camera orientation
          const _camUp = new THREE.Vector3();
          graph.onEngineTick(() => {
            const camera = graph.camera();
            _camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
            const currentNodes = graph.graphData().nodes;
            for (let i = 0; i < currentNodes.length; i++) {
              const s = currentNodes[i].__labelSprite;
              if (s) {
                s.position.set(-_camUp.x * 6, -_camUp.y * 6, -_camUp.z * 6);
              }
            }
          });

          // Animate hover transitions (~0.5s ease)
          const LERP_SPEED = 0.08; // per frame, ~0.5s to settle at 60fps
          function lerp(a, b, t) { return a + (b - a) * t; }
          function lerpColor(current, target, t) {
            // Parse hex #RRGGBB
            const cr = parseInt(current.slice(1,3),16), cg = parseInt(current.slice(3,5),16), cb = parseInt(current.slice(5,7),16);
            const tr = parseInt(target.slice(1,3),16), tg = parseInt(target.slice(3,5),16), tb = parseInt(target.slice(5,7),16);
            const r = Math.round(lerp(cr,tr,t)), g = Math.round(lerp(cg,tg,t)), b2 = Math.round(lerp(cb,tb,t));
            return '#' + ((1<<24)+(r<<16)+(g<<8)+b2).toString(16).slice(1);
          }

          // Initialize per-node/link animation state
          graph.graphData().nodes.forEach(n => { n._curColor = nodeColors[n.type] || '#999999'; n._curLabelOp = 0.55; n._curScale = 1.0; });
          graph.graphData().links.forEach(l => { l._curOp = 0.15; l._curWidth = 0.3; });

          function animateHover() {
            window._hoverAnimFrame = requestAnimationFrame(animateHover);
            // Determine active focus: hover takes priority, then selection
            const hId = window._hoveredNodeId;
            const sId = window._selectedNodeId;
            const sNeighbors = window._selectedNeighborIds;
            const focusId = hId || sId;
            // Connected set: for hover use hover connections, for selection use selection neighbors
            let focusConn = null;
            if (hId) {
              focusConn = window._connectedNodeIds;
            } else if (sId && sNeighbors) {
              focusConn = new Set(sNeighbors);
              focusConn.add(sId);
            }

            const nodes = graph.graphData().nodes;
            const links = graph.graphData().links;

            // Animate nodes
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              const isConn = !focusId || (focusConn && focusConn.has(n.id));
              const isFocused = focusId && n.id === focusId;
              const targetColor = isConn ? (nodeColors[n.type] || '#999999') : '#2a2a2a';
              const targetLabelOp = !focusId ? 0.55 : (isConn ? 0.9 : 0.1);
              const targetScale = isFocused ? 1.3 : 1.0;

              n._curColor = lerpColor(n._curColor || '#999999', targetColor, LERP_SPEED);
              n._curLabelOp = lerp(n._curLabelOp || 0.55, targetLabelOp, LERP_SPEED);
              n._curScale = lerp(n._curScale || 1.0, targetScale, LERP_SPEED);

              if (n.__labelSprite) {
                n.__labelSprite.material.opacity = n._curLabelOp;
                const bs = n.__labelBaseScale;
                if (bs) n.__labelSprite.scale.set(bs.x * n._curScale, bs.y * n._curScale, bs.z * n._curScale);
              }
            }
            graph.nodeColor(n => n._curColor);

            // Animate links
            for (let i = 0; i < links.length; i++) {
              const l = links[i];
              const src = typeof l.source === 'object' ? l.source.id : l.source;
              const tgt = typeof l.target === 'object' ? l.target.id : l.target;
              const touchesFocus = focusId && (src === focusId || tgt === focusId);
              // When selected, only show edges where both endpoints are in the connected set
              const bothInSet = focusConn && focusConn.has(src) && focusConn.has(tgt);
              const isConn = hId ? touchesFocus : (sId ? (touchesFocus && bothInSet) : false);
              const targetOp = !focusId ? 0.15 : (isConn ? 0.8 : 0.0);
              const targetWidth = !focusId ? 0.3 : (isConn ? 1.5 : 0.3);
              l._curOp = lerp(l._curOp || 0.15, targetOp, LERP_SPEED);
              l._curWidth = lerp(l._curWidth || 0.3, targetWidth, LERP_SPEED);
            }
            graph.linkColor(l => `rgba(255,255,255,${(l._curOp != null ? l._curOp : 0.15).toFixed(3)})`);
            graph.linkWidth(l => l._curWidth);
          }
          animateHover();

          // Resize graph when window resizes
          function resizeGraph() {
            graph.width(container.clientWidth);
            graph.height(container.clientHeight);
          }
          window._networkResizeHandler = resizeGraph;
          window.addEventListener('resize', resizeGraph);

          // Store graph and full data for filtering
          window._forceGraph = graph;
          window._forceGraphData = graphData;
          // No need to save link defs — we never swap graphData during selection
          window._selectedNode = null;

          // Fade out controls hint after first interaction
          const hint = document.getElementById('network-controls-hint');
          if (hint) {
            const fadeHint = () => {
              hint.style.opacity = '0';
              container.removeEventListener('pointerdown', fadeHint);
              container.removeEventListener('wheel', fadeHint);
            };
            container.addEventListener('pointerdown', fadeHint);
            container.addEventListener('wheel', fadeHint);
          }

          // Helper: get link endpoint ID (handles both string and object refs)
          function linkId(endpoint) {
            return typeof endpoint === 'object' ? endpoint.id : endpoint;
          }

          // Helper: get filter state for each type from buttons
          function getTypeStates() {
            const states = { on: new Set(), connected: new Set() };
            const filters = document.getElementById('network-filters');
            if (filters) {
              filters.querySelectorAll('.network-toggle').forEach(btn => {
                if (btn.classList.contains('off')) return;
                if (btn.classList.contains('connected')) states.connected.add(btn.dataset.type);
                else states.on.add(btn.dataset.type);
              });
            }
            return states;
          }

          // Helper: get all visible types (on + connected) for backward compat
          function getCheckedTypes() {
            const s = getTypeStates();
            return [...s.on, ...s.connected];
          }

          // Helper: apply type filters to full data (no selection)
          function applyTypeFilters() {
            const { on: onTypes, connected: connTypes } = getTypeStates();
            const fullData = window._forceGraphData;
            // First pass: all fully-on nodes
            const onNodes = fullData.nodes.filter(n => onTypes.has(n.type));
            const onIds = new Set(onNodes.map(n => n.id));
            // Second pass: connected-type nodes that link to at least one on-node
            const connNodes = connTypes.size > 0
              ? fullData.nodes.filter(n => connTypes.has(n.type) && fullData.links.some(l =>
                  (linkId(l.source) === n.id && onIds.has(linkId(l.target))) ||
                  (linkId(l.target) === n.id && onIds.has(linkId(l.source)))
                ))
              : [];
            const filteredNodes = [...onNodes, ...connNodes];
            const visibleIds = new Set(filteredNodes.map(n => n.id));
            const filteredLinks = fullData.links.filter(l =>
              visibleIds.has(linkId(l.source)) && visibleIds.has(linkId(l.target))
            );
            graph.graphData({ nodes: filteredNodes, links: filteredLinks });
          }

          // Select a node: keep all nodes & links, but zero out forces for non-adjacent links
          function selectNode(node) {
            // Unpin all nodes from any previous selection
            graph.graphData().nodes.forEach(n => {
              n.fx = undefined; n.fy = undefined; n.fz = undefined;
            });

            window._selectedNode = node;
            const nodeId = node.id;

            // Find neighbor IDs from current graph links
            const neighborIds = new Set();
            graph.graphData().links.forEach(l => {
              const srcId = typeof l.source === 'object' ? l.source.id : l.source;
              const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
              if (srcId === nodeId) neighborIds.add(tgtId);
              else if (tgtId === nodeId) neighborIds.add(srcId);
            });

            // Store selection context for animation system
            window._selectedNodeId = nodeId;
            window._selectedNeighborIds = neighborIds;

            // Pin selected node at its current position so the camera target stays valid
            const selectedInGraph = graph.graphData().nodes.find(n => n.id === nodeId);
            if (selectedInGraph) {
              selectedInGraph.fx = selectedInGraph.x;
              selectedInGraph.fy = selectedInGraph.y;
              selectedInGraph.fz = selectedInGraph.z;
            }

            // Disable center force so unconnected nodes aren't pulled to origin
            graph.d3Force('center', null);

            // Zero out link force strength for non-adjacent links
            graph.d3Force('link').strength(l => {
              const src = typeof l.source === 'object' ? l.source.id : l.source;
              const tgt = typeof l.target === 'object' ? l.target.id : l.target;
              return (src === nodeId || tgt === nodeId) ? 1 : 0;
            });

            // Strengthen charge repulsion for unconnected nodes to push them away
            graph.d3Force('charge').strength(n => {
              if (n.id === nodeId || neighborIds.has(n.id)) return -30;
              return -200;
            });
            graph.d3ReheatSimulation();

            // Save camera state before zooming in
            const cam = graph.camera();
            window._preSelectCameraPos = { x: cam.position.x, y: cam.position.y, z: cam.position.z };
            const lookAt = graph.controls().target;
            window._preSelectCameraLookAt = { x: lookAt.x, y: lookAt.y, z: lookAt.z };

            // Fly camera to the pinned node's position
            const nx = selectedInGraph ? selectedInGraph.x : 0;
            const ny = selectedInGraph ? selectedInGraph.y : 0;
            const nz = selectedInGraph ? selectedInGraph.z : 0;
            const ctrl = graph.controls();
            ctrl.enabled = false;
            graph.cameraPosition(
              { x: nx, y: ny, z: nz + 300 },
              { x: nx, y: ny, z: nz },
              1500
            );
            setTimeout(() => { ctrl.enabled = true; }, 1550);

            // Show detail panel
            showDetail(node);
          }

          // Deselect: gradually restore forces and zoom out
          function deselectNode() {
            window._selectedNode = null;
            window._selectedNodeId = null;
            window._selectedNeighborIds = null;

            // Unpin all nodes
            graph.graphData().nodes.forEach(n => {
              n.fx = undefined; n.fy = undefined; n.fz = undefined;
            });

            // Restore center force
            graph.d3Force('center', window._d3ForceCenter);

            // Gradually ramp link strength and charge back to defaults
            if (window._forceRampInterval) clearInterval(window._forceRampInterval);
            const savedLinkStr = window._d3DefaultLinkStrength;
            let t = 0;
            const steps = 120; // ~4s at 33ms interval
            // Increase velocity decay so nodes slow down faster (less bouncing)
            graph.d3VelocityDecay(0.6);
            // Single gentle reheat — don't re-spike alpha each frame
            graph.d3AlphaDecay(0.01);
            graph.d3ReheatSimulation();

            window._forceRampInterval = setInterval(() => {
              t = Math.min(t + 1 / steps, 1);
              const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

              // Charge: -200 → -30
              graph.d3Force('charge').strength(() => -200 + 170 * ease);
              // Link strength: 0 → default
              graph.d3Force('link').strength(typeof savedLinkStr === 'function'
                ? (l => savedLinkStr(l) * ease)
                : ease);

              if (t >= 1) {
                graph.d3Force('link').strength(savedLinkStr);
                graph.d3Force('charge').strength(-30);
                // Restore default simulation parameters
                graph.d3VelocityDecay(0.4);
                graph.d3AlphaDecay(0.0228);
                clearInterval(window._forceRampInterval);
              }
            }, 33);

            // Restore camera: use saved zoom distance but target the graph centroid
            // (nodes may have shifted, so the old look-at could be off-screen)
            if (window._preSelectCameraPos) {
              const pre = window._preSelectCameraPos;
              const preLook = window._preSelectCameraLookAt;
              // Compute saved distance from camera to look-at
              const dx = pre.x - preLook.x, dy = pre.y - preLook.y, dz = pre.z - preLook.z;
              const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
              // Wait for nodes to start settling, then target their centroid
              setTimeout(() => {
                const nodes = graph.graphData().nodes;
                let cx = 0, cy = 0, cz = 0;
                nodes.forEach(n => { cx += n.x || 0; cy += n.y || 0; cz += n.z || 0; });
                cx /= nodes.length; cy /= nodes.length; cz /= nodes.length;
                graph.cameraPosition(
                  { x: cx, y: cy, z: cz + dist },
                  { x: cx, y: cy, z: cz },
                  1500
                );
              }, 800);
            }

            const detail = document.getElementById('network-detail');
            if (detail) detail.classList.remove('visible');
          }

          // Show detail panel for a node
          function showDetail(node) {
            const data = node.raw;
            const type = node.type;
            const detail = document.getElementById('network-detail');
            if (!detail || !data) return;

            let html = '';
            const detailPortrait = resolvePortraitUrl(data, api);
            html += `<div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;">`;
            html += `<img src="${detailPortrait}" alt="" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">`;
            html += `<h3 style="margin:0">${data.name || data.id}</h3></div>`;
            if (data.summary) html += `<p>${data.summary}</p>`;
            if (data.status) html += `<p><span class="status-badge ${data.status}">${data.status}</span></p>`;

            switch (type) {
              case 'people':
                if (data.name_ja) html += `<p style="opacity: 0.6;">${data.name_ja}</p>`;
                if (data.job_title) html += `<p><strong>Title:</strong> ${data.job_title}</p>`;
                if (data.role_categories) html += `<p><strong>Roles:</strong> ${data.role_categories.join(', ')}</p>`;
                const netDomains = getRelated(data.id, { type: 'has_affinity_for' });
                if (netDomains.length > 0) html += `<p><strong>Domains:</strong> ${netDomains.map(r => `<a href="${entityHref('domains', r.entity.id)}" style="color:inherit;text-decoration:underline dotted;">${getEntityDisplay(r.entity.id)}</a>`).join(', ')}</p>`;
                if (data.background) html += `<p style="margin-top: 0.5rem; opacity: 0.8; font-size: 0.85rem;">${data.background}</p>`;
                break;
              case 'institutions':
                if (data.institution_type) html += `<p><strong>Type:</strong> ${data.institution_type.replace(/_/g, ' ')}</p>`;
                if (data.ecosystem_role) html += `<p><strong>Role:</strong> ${data.ecosystem_role}</p>`;
                break;
              case 'projects':
                if (data.domains) html += `<p><strong>Domains:</strong> ${data.domains.join(', ')}</p>`;
                if (data.project_goals) html += `<p><strong>Goals:</strong> ${data.project_goals.join('; ')}</p>`;
                break;
              case 'initiatives':
                if (data.purpose) html += `<p><strong>Purpose:</strong> ${data.purpose}</p>`;
                if (data.domains) html += `<p><strong>Domains:</strong> ${data.domains.join(', ')}</p>`;
                break;
              case 'courses':
                if (data.name_ja) html += `<p style="opacity:0.6;">${data.name_ja}</p>`;
                if (data.credits) html += `<p><strong>Credits:</strong> ${data.credits}</p>`;
                if (data.semester) html += `<p><strong>Semester:</strong> ${data.semester}</p>`;
                if (data.schedule) html += `<p><strong>Schedule:</strong> ${data.schedule}</p>`;
                if (data.program) html += `<p><strong>Program:</strong> ${data.program.map(p => p.replace(/_/g, ' ')).join(', ')}</p>`;
                break;
              case 'events':
                if (data.date) html += `<p><strong>Date:</strong> ${data.date}</p>`;
                if (data.event_type) html += `<p><strong>Type:</strong> ${data.event_type}</p>`;
                break;
              case 'domains':
                break;
              case 'places':
                if (data.place_type) html += `<p><strong>Type:</strong> ${data.place_type}</p>`;
                if (data.address) html += `<p><strong>Address:</strong> ${data.address}</p>`;
                break;
              case 'publications':
                if (data.publication_type) html += `<p><strong>Type:</strong> ${data.publication_type.replace(/_/g, ' ')}</p>`;
                if (data.venue) html += `<p><strong>Venue:</strong> ${data.venue}</p>`;
                if (data.published_date) html += `<p><strong>Published:</strong> ${data.published_date}</p>`;
                break;
            }

            html += `<p style="margin-top: 0.75rem;"><a href="${entityHref(type, data.id)}" style="color: ${nodeColors[type]}; text-decoration: none; border-bottom: 1px solid ${nodeColors[type]};">View detail</a> &middot; <a href="#${type}" style="color: ${nodeColors[type]}; text-decoration: none; border-bottom: 1px solid ${nodeColors[type]};">View all ${(registryMeta[type] || {}).plural || type}</a></p>`;

            detail.innerHTML = html;
            detail.classList.add('visible');
          }

          // Type filter toggle buttons
          const filters = document.getElementById('network-filters');
          if (filters) {
            filters.querySelectorAll('.network-toggle').forEach(btn => {
              btn.addEventListener('click', function () {
                // Cycle: on → connected → off → on
                if (!btn.classList.contains('off') && !btn.classList.contains('connected')) {
                  btn.classList.add('connected');
                } else if (btn.classList.contains('connected')) {
                  btn.classList.remove('connected');
                  btn.classList.add('off');
                } else {
                  btn.classList.remove('off');
                }
                // Update URL to reflect filter states
                const states = getTypeStates();
                const onArr = [...states.on];
                const connArr = [...states.connected];
                const isDefault = networkDefaultOn.size === onArr.length && onArr.every(t => networkDefaultOn.has(t)) && connArr.length === 0;
                let newHash = '#network';
                if (!isDefault) {
                  const parts = [];
                  if (onArr.length) parts.push('show=' + onArr.join(','));
                  if (connArr.length) parts.push('connected=' + connArr.join(','));
                  if (parts.length) newHash += '?' + parts.join('&');
                }
                history.replaceState(null, '', newHash);
                if (window._selectedNode) {
                  selectNode(window._selectedNode);
                } else {
                  applyTypeFilters();
                }
              });
            });
          }

          // Apply initial filters (respects buttons that start with .off)
          applyTypeFilters();
        })
        .catch(err => {
          const container = document.getElementById('network-container');
          if (container) {
            container.innerHTML = `<p style="color: #c62828; padding: 2rem;">Error loading network data: ${err.message}</p>`;
          }
        });
    }

    async function loadCharter() {
      clearOrientationRotator();
      currentDoc = 'charter';
      showSidebar('charter');
      contentEl.innerHTML = '<p>Loading Charter&hellip;</p>';
      updateActiveNavLink('charter');

      try {
        const result = await api.getDocumentContent('charter');
        const markdown = result.content || result;
        let html = marked.parse(markdown);

        html = '<div class="charter-banner">The definitive source for the Charter is <a href="https://charter.henkaku.center" target="_blank" rel="noopener noreferrer">charter.henkaku.center</a>, which also provides an interface for proposing and voting on amendments and exporting the Charter in various formats.</div><div class="charter-version" id="charter-version-info"></div>' + html;

        contentEl.innerHTML = html;

        // Fetch version info
        try {
          const head = await api.getHead('charter');
          if (head && head.current_version_id) {
            const versions = await api.getVersions('charter');
            if (versions && versions.length > 0) {
              const latest = versions[versions.length - 1];
              const date = new Date(latest.approved_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
              const versionEl = document.getElementById('charter-version-info');
              if (versionEl) versionEl.textContent = `Current version: ${date}`;
            }
          }
        } catch (e) { /* version info is non-critical */ }

        assignHeadingIds();
        makeCollapsible();
        buildDocToc('charter');
        window.scrollTo(0, 0);
      } catch (err) {
        contentEl.innerHTML = `<p style="color:#c62828;">Error loading Charter: ${err.message}</p>`;
      }
    }

    function loadDoc(path, docKey) {
      clearOrientationRotator();
      currentDoc = docKey;
      const cacheBuster = `?t=${Date.now()}`;

      fetch(path + cacheBuster, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error(`Failed to load ${path}`);
          return response.text();
        })
        .then(markdown => {
          // Extract and preserve HTML comments
          const commentPlaceholders = [];
          let processedMarkdown = markdown.replace(/<!--([\s\S]*?)-->/g, (match, content) => {
            const index = commentPlaceholders.length;
            commentPlaceholders.push(content.trim());
            return `<!--PLACEHOLDER_${index}-->`;
          });

          // Parse markdown
          let html = marked.parse(processedMarkdown);

          // Replace comment placeholders
          commentPlaceholders.forEach((content, index) => {
            const placeholder = `<!--PLACEHOLDER_${index}-->`;
            const escapedContent = content
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/\n/g, '<br>');
            const commentDiv = `<div class="html-comment">${escapedContent}</div>`;
            html = html.replace(placeholder, commentDiv);
          });

          // Charter banner: link to definitive source with version info
          if (docKey === 'charter') {
            html = '<div class="charter-banner">The definitive source for the Charter is <a href="https://charter.henkaku.center" target="_blank" rel="noopener noreferrer">charter.henkaku.center</a>, which also provides an interface for proposing and voting on amendments and exporting the Charter in various formats.</div><div class="charter-version" id="charter-version-info"></div>' + html;
          }

          contentEl.innerHTML = html;

          // Fetch Charter version info
          if (docKey === 'charter') {
            fetch('https://charter.henkaku.center/data/versions.json?t=' + Date.now())
              .then(r => r.json())
              .then(versions => {
                var keys = Object.keys(versions).sort();
                var latest = versions[keys[keys.length - 1]];
                var vNum = keys[keys.length - 1].split('_')[0].replace('v', '');
                var date = new Date(latest.approved_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                var el = document.getElementById('charter-version-info');
                if (el) el.textContent = 'Version ' + vNum + ' \u00b7 Approved ' + date;
              })
              .catch(function() {});
          }

          // Add IDs to headings for anchor links
          assignHeadingIds();

          // Show site map sidebar
          showSidebar(docKey);

          // Make sections collapsible
          makeCollapsible();

          // Build right-hand document TOC
          buildDocToc(docKey);

          // Update active nav link
          updateActiveNavLink(docKey);

          // Scroll to top
          window.scrollTo(0, 0);
        })
        .catch(error => {
          contentEl.innerHTML = "<p>Error loading document.</p>";
          console.error(error);
        });
    }

    function showSidebar(activeKey) {
      headings = []; // Clear so scroll spy doesn't interfere
      tocListEl.innerHTML = '';
      docTocEl.classList.remove('visible'); // Hide right TOC until buildDocToc re-enables
      siteMap.forEach(function(item) {
        var li = document.createElement('li');
        if (item.group) {
          var span = document.createElement('span');
          span.textContent = item.group;
          span.classList.add('toc-group-label');
          li.appendChild(span);
        } else if (item.placeholder) {
          var span = document.createElement('span');
          span.textContent = item.label;
          span.classList.add('toc-disabled');
          li.appendChild(span);
        } else {
          var a = document.createElement('a');
          if (item.external) {
            a.href = item.external;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          } else {
            a.href = '#' + item.key;
          }
          a.textContent = item.label;
          if (item.key === activeKey) a.classList.add('active');
          li.appendChild(a);
        }
        tocListEl.appendChild(li);
      });
      tocEl.querySelector('h4').style.display = 'none';
      tocEl.classList.add('visible');
      layoutEl.classList.add('has-toc');
    }

    function assignHeadingIds() {
      contentEl.querySelectorAll('h2, h3').forEach(function(heading) {
        var text = heading.textContent;
        var id = 'section-' + text.toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/(^-|-$)/g, '')
          .substring(0, 50);
        heading.id = id;
      });
    }

    // Pages that get a right-hand document TOC
    const docTocPages = ['charter', 'archetypes', 'about', 'status'];

    function buildDocToc(docKey) {
      docTocListEl.innerHTML = '';
      headings = [];

      if (!docTocPages.includes(docKey)) {
        docTocEl.classList.remove('visible');
        return;
      }

      contentEl.querySelectorAll('h2, h3').forEach(function(heading) {
        var id = heading.id;
        if (!id) return;
        headings.push({ id: id, el: heading });

        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = heading.textContent;
        if (heading.tagName === 'H3') li.classList.add('dtoc-h3');
        a.addEventListener('click', function(e) {
          e.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', '#' + docKey);
        });
        li.appendChild(a);
        docTocListEl.appendChild(li);
      });

      if (headings.length > 0) {
        docTocEl.classList.add('visible');
      } else {
        docTocEl.classList.remove('visible');
      }
    }

    function updateActiveDocTocLink() {
      if (!docTocEl.classList.contains('visible')) return;
      if (headings.length === 0) return;

      let activeId = null;
      const scrollTop = window.scrollY + 100;

      for (let i = headings.length - 1; i >= 0; i--) {
        if (headings[i].el.offsetTop <= scrollTop) {
          activeId = headings[i].id;
          break;
        }
      }

      docTocListEl.querySelectorAll('a').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + activeId);
      });
    }

    function makeCollapsible() {
      const h2s = contentEl.querySelectorAll('h2');

      h2s.forEach(h2 => {
        // Skip if already processed
        if (h2.classList.contains('section-header')) return;

        h2.classList.add('section-header');

        // Collect all siblings until next h2 or end
        const sectionContent = document.createElement('div');
        sectionContent.classList.add('section-content');

        let sibling = h2.nextElementSibling;
        const siblings = [];

        while (sibling && sibling.tagName !== 'H2') {
          siblings.push(sibling);
          sibling = sibling.nextElementSibling;
        }

        // Move siblings into section content div
        siblings.forEach(s => sectionContent.appendChild(s));
        h2.after(sectionContent);

        // Toggle on click
        h2.addEventListener('click', () => {
          h2.classList.toggle('collapsed');
          sectionContent.classList.toggle('collapsed');
        });
      });
    }

    function updateActiveNavLink(docKey) {
      document.querySelectorAll('.nav-links a').forEach(a => {
        const href = a.getAttribute('href').slice(1);
        a.classList.toggle('active', href === docKey);
      });
    }

    // Scroll spy for TOC
    function updateActiveTocLink() {
      if (!tocEl.classList.contains('visible')) return;
      if (headings.length === 0) return; // Emergent sidebar, not heading TOC

      let activeId = null;
      const scrollTop = window.scrollY + 100;

      for (let i = headings.length - 1; i >= 0; i--) {
        if (headings[i].el.offsetTop <= scrollTop) {
          activeId = headings[i].id;
          break;
        }
      }

      tocListEl.querySelectorAll('a').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + activeId);
      });
    }

    // Back to top button
    function updateBackToTop() {
      backToTopBtn.classList.toggle('visible', window.scrollY > 300);
    }

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Throttled scroll handler
    let scrollTimeout;
    window.addEventListener('scroll', () => {
      if (scrollTimeout) return;
      scrollTimeout = setTimeout(() => {
        updateActiveTocLink();
        updateActiveDocTocLink();
        updateBackToTop();
        scrollTimeout = null;
      }, 50);
    });

    async function handleLogin() {
      var email = document.getElementById('login-email');
      email = email ? email.value.trim() : '';
      var password = document.getElementById('login-password');
      password = password ? password.value : '';
      if (!email || !password) { showModalError('Please enter email and password.'); return; }

      var loginBtn = document.getElementById('login-btn');
      if (loginBtn) { loginBtn.disabled = true; loginBtn.textContent = 'Verifying\u2026'; }

      try {
        await api.login(email, password);
        currentUser = await api.me();
        if (currentUser.must_change_password) {
          closeModal();
          showForcePasswordChange();
          return;
        }
        closeModal();
        updateLoginUI();
        loadFromHash();
      } catch (err) {
        showModalError(err.message || 'Login failed. Check your credentials.');
        if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = 'Login'; }
      }

    function buildEditForm(entry, type, isNew) {
      var html = '';
      var keys = Object.keys(entry);

      keys.forEach(function(key) {
        if (editSkipFields.indexOf(key) !== -1) return;
        var val = entry[key];
        var label = escapeHtml(key.replace(/_/g, ' '));

        // ID field
        if (key === 'id') {
          html += '<div class="form-group"><label>' + label + '</label>' +
            '<input type="text" name="id" value="' + escapeAttr(val) + '"' + (isNew ? '' : ' readonly') + ' />' +
            (isNew ? '<div class="field-hint">e.g. person_firstlast, proj_short_name</div>' : '') + '</div>';
          return;
        }

        // Status dropdown
        if (key === 'status' && statusOptionsByType[type]) {
          var opts = statusOptionsByType[type].map(function(s) {
            return '<option value="' + s + '"' + (val === s ? ' selected' : '') + '>' + s + '</option>';
          }).join('');
          html += '<div class="form-group"><label>' + label + '</label>' +
            '<select name="' + key + '">' + opts + '</select></div>';
          return;
        }

        // institution_type dropdown
        if (key === 'institution_type') {
          var itypes = ['university', 'graduate_school', 'research_center', 'lab', 'institute', 'foundation', 'company', 'government', 'ngo', 'nonprofit', 'hospital'];
          var iopts = '<option value="">-- Select --</option>' + itypes.map(function(t) {
            return '<option value="' + t + '"' + (val === t ? ' selected' : '') + '>' + escapeHtml(t.replace(/_/g, ' ')) + '</option>';
          }).join('');
          html += '<div class="form-group"><label>' + label + '</label>' +
            '<select name="' + key + '">' + iopts + '</select></div>';
          return;
        }

        // String field
        if (typeof val === 'string') {
          if (longTextFields.indexOf(key) !== -1) {
            html += '<div class="form-group"><label>' + label + '</label>' +
              '<textarea name="' + key + '" class="tall">' + escapeHtml(val) + '</textarea></div>';
          } else {
            html += '<div class="form-group"><label>' + label + '</label>' +
              '<input type="text" name="' + key + '" value="' + escapeAttr(val) + '" /></div>';
          }
          return;
        }

        // Number field
        if (typeof val === 'number') {
          html += '<div class="form-group"><label>' + label + '</label>' +
            '<input type="number" name="' + key + '" value="' + val + '" /></div>';
          return;
        }

        // Array of objects (links)
        if (Array.isArray(val) && arrayItemTemplates[key]) {
          html += '<div class="form-group"><label>' + label + '</label><div class="array-items" data-array-field="' + key + '">';
          val.forEach(function(item) {
            html += renderArrayItemHtml(key, item);
          });
          html += '</div><button type="button" class="add-item-btn" onclick="addArrayItem(\'' + key + '\')">+ Add</button></div>';
          return;
        }

        // Array of strings (domains, capabilities, etc.)
        if (Array.isArray(val)) {
          html += '<div class="form-group"><label>' + label + '</label>' +
            '<textarea name="' + key + '" data-field-type="string-array">' + escapeHtml((val || []).join('\n')) + '</textarea>' +
            '<div class="field-hint">One item per line</div></div>';
          return;
        }

        // Skip complex objects (schedule, exhibitions, location) — not editable inline
        if (typeof val === 'object' && val !== null) {
          return;
        }

        // Fallback
        html += '<div class="form-group"><label>' + label + '</label>' +
          '<input type="text" name="' + key + '" value="' + escapeAttr(String(val == null ? '' : val)) + '" /></div>';
      });

      // Add relation editor (only for existing entities)
      if (!isNew && entry.id) {
        html += buildRelationEditor(entry.id, type);
      }

      return html;
    }

    function collectFormData(entry, type) {
      var form = document.getElementById('edit-form');
      if (!form) return null;
      var updated = {};
      var keys = Object.keys(entry);

      keys.forEach(function(key) {
        if (editSkipFields.indexOf(key) !== -1) {
          updated[key] = entry[key];
          return;
        }

        // Array of objects (links)
        if (Array.isArray(entry[key]) && arrayItemTemplates[key]) {
          var container = form.querySelector('[data-array-field="' + key + '"]');
          if (!container) { updated[key] = entry[key]; return; }
          var items = [];
          container.querySelectorAll('.array-item').forEach(function(row) {
            var item = {};
            var template = arrayItemTemplates[key];
            Object.keys(template).forEach(function(subKey) {
              var el = row.querySelector('[data-subfield="' + subKey + '"]');
              item[subKey] = el ? el.value : '';
            });
            items.push(item);
          });
          updated[key] = items;
          return;
        }

        // Simple fields (string, number, select, textarea)
        var input = form.querySelector('[name="' + key + '"]');
        if (!input) { updated[key] = entry[key]; return; }

        var fieldType = input.getAttribute('data-field-type');
        var rawVal = input.value;

        if (key === 'id') { updated[key] = rawVal; return; }

        if (fieldType === 'string-array') {
          updated[key] = rawVal.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
          return;
        }

        var originalVal = entry[key];
        if (typeof originalVal === 'number') {
          updated[key] = Number(rawVal);
        } else if (typeof originalVal === 'boolean') {
          updated[key] = rawVal === 'true';
        } else {
          updated[key] = rawVal;
        }
      });

      return updated;
    }

    // Collect relations from the edit modal's relation editor
    function collectRelationsFromForm(entityId) {
      var container = document.getElementById('relation-items');
      if (!container) return null;

      var newRelations = [];
      container.querySelectorAll('.relation-row').forEach(function(row) {
        var source = row.getAttribute('data-source');
        var target = row.getAttribute('data-target');
        var type = row.getAttribute('data-type');
        if (source === '_current') source = entityId;
        if (target === '_current') target = entityId;
        if (source && target && type) {
          newRelations.push({ source: source, target: target, type: type });
        }
      });

      return newRelations;
    }

    async function handleSave(type) {
      var saveBtn = document.getElementById('save-btn');
      var form = document.getElementById('edit-form');
      var entryId = form ? form.querySelector('[name="id"]').value : '';
      var entries = store.byType[type];
      if (!entries) { showModalError('Data not loaded.'); return; }

      var original = entries.find(function(e) { return e.id === entryId; });
      if (!original) { showModalError('Entry not found.'); return; }

      var updated;
      try {
        updated = collectFormData(original, type);
      } catch (err) {
        showModalError('Error reading form: ' + err.message);
        return;
      }
      if (!updated) { showModalError('Could not read form data.'); return; }

      // Collect updated relations
      var newRelations = collectRelationsFromForm(entryId);

      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026'; }

      try {
        if (!isLoggedIn()) throw new Error('Not logged in.');
        var payload = unflattenEntityForUpdate(updated);
        await api.updateEntity(entryId, payload);
        if (newRelations) await syncRelations(entryId, newRelations);
        closeModal();
        _storeReady = null;
        loadFromHash();

    async function handleSaveNew(type) {
      var saveBtn = document.getElementById('save-btn');
      var form = document.getElementById('edit-form');
      var entryId = form ? form.querySelector('[name="id"]').value.trim() : '';

      if (!entryId) { showModalError('ID is required.'); return; }
      if (/\s/.test(entryId)) { showModalError('ID must not contain spaces.'); return; }

      var template = entityTemplates[type];
      var updated;
      try {
        updated = collectFormData(template, type);
      } catch (err) {
        showModalError('Error reading form: ' + err.message);
        return;
      }
      if (!updated) { showModalError('Could not read form data.'); return; }
      updated.id = entryId;
      updated.type = TYPE_FROM_PLURAL[type] || type;

      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Creating\u2026'; }

      try {
        if (!isLoggedIn()) throw new Error('Not logged in.');
        var payload = unflattenEntityForCreate(updated);
        await api.createEntity(payload);
        closeModal();
        _storeReady = null;
        loadFromHash();
      } catch (err) {
        showModalError(err.message);
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Create'; }
      }
    }

    // Sync relations for an entity: diff current store against form state, delete/create as needed
    async function syncRelations(entityId, newRelations) {
      // Normalize form relations: flip inverse types back to canonical form
      var normalizedNew = newRelations.map(function(rel) {
        var s = rel.source;
        var t = rel.target;
        var type = rel.type;

        // Check if this was an incoming relation shown as inverse — flip back
        var typeInfo = RELATION_TYPES[type];
        if (typeInfo && typeInfo.inverse !== type) {
          var origRel = store.relations.find(function(r) {
            return r.target === entityId && r.source === t && RELATION_TYPES[r.type] && RELATION_TYPES[r.type].inverse === type;
          });
          if (origRel) {
            s = t;
            t = entityId;
            type = origRel.type;
          }
        }

        return { source: s, target: t, type: type, meta: rel.meta };
      });

      // Get current relations from store that involve this entity
      var currentRels = store.relations.filter(function(r) {
        return r.source === entityId || r.target === entityId;
      });

      // Build key for comparison
      function relKey(r) { return r.source + '|' + r.target + '|' + r.type; }

      var currentKeys = {};
      currentRels.forEach(function(r) { currentKeys[relKey(r)] = r; });

      var newKeys = {};
      normalizedNew.forEach(function(r) { newKeys[relKey(r)] = r; });

      // Delete removed relations
      for (var key in currentKeys) {
        if (!newKeys[key] && currentKeys[key]._apiId) {
          await api.deleteRelation(currentKeys[key]._apiId);
        }
      }

      // Create added relations
      for (var key in newKeys) {
        if (!currentKeys[key]) {
          await api.createRelation(unflattenRelationForCreate(newKeys[key]));
        }
      }
    }

    // Load document based on hash
    function loadFromHash() {
      const rawHash = window.location.hash.slice(1) || 'home';
      // Parse entity deep link: #type/entityId
      const baseHash = rawHash.split('?')[0];
      const slashIdx = baseHash.indexOf('/');
      const hash = slashIdx > 0 ? baseHash.slice(0, slashIdx) : baseHash;
      const entityId = slashIdx > 0 ? rawHash.slice(slashIdx + 1) : null;
      const docKey = Object.keys(routes).includes(hash) ? hash : 'home';

      // Clean up network resize listener when leaving
      if (window._networkResizeHandler) {
        window.removeEventListener('resize', window._networkResizeHandler);
        window._networkResizeHandler = null;
      }

      // Tag content element for page-specific CSS
      contentEl.setAttribute('data-page', docKey);

      // Full-bleed layout for network page only
      const isNetwork = docKey === 'network';
      layoutEl.classList.toggle('full-bleed', isNetwork);
      document.getElementById('site-footer').style.display = isNetwork ? 'none' : '';
      document.body.style.background = isNetwork ? '#1e1e1e' : '';
      document.body.style.overflow = isNetwork ? 'hidden' : '';

      if (docKey === 'home') {
        loadLanding();
      } else if (docKey === 'references') {
        loadReferences();
      } else if (docKey === 'history') {
        loadHistory();
      } else if (docKey === 'charter') {
        loadCharter();
      } else if (['people', 'projects', 'initiatives', 'institutions', 'courses', 'events', 'domains', 'places', 'publications', 'vectors', 'deltas'].includes(docKey)) {
        if (entityId) {
          loadEntityDetail(docKey, entityId);
        } else {
          loadRegistryList(docKey);
        }
      } else if (docKey === 'network') {
        loadNetwork();
      } else if (docKey === 'feedback') {
        loadFeedback();
      } else if (docKey === 'contribute') {
        loadContribute();
      } else if (docKey === 'contact') {
        loadContact();
      } else {
        const path = routes[docKey];
        loadDoc(path, docKey);
      }
    }

    function loadFeedbackEntries() {
      var entriesEl = document.getElementById('feedback-entries');
      if (!entriesEl) return;

      Promise.all([api.getFeedback('compass'), api.getStakeholders().catch(function() { return []; })])
        .then(function(results) {
          var entries = results[0];
          var users = results[1];
          var userNames = {};
          users.forEach(function(u) { userNames[u.id] = u.name; });
          if (!entries || entries.length === 0) {
            entriesEl.innerHTML = '<div class="feedback-empty">No feedback submitted yet.</div>';
            return;
          }

          var closedStatuses = { resolved: true, closed: true };
          var openEntries = entries.filter(function(e) { return !closedStatuses[e.status]; });
          var closedEntries = entries.filter(function(e) { return !!closedStatuses[e.status]; });

          function renderList(list) {
            var listEl = document.getElementById('feedback-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            if (list.length === 0) {
              listEl.innerHTML = '<div class="feedback-empty">No items.</div>';
              return;
            }
            list.forEach(function(entry) {
              listEl.appendChild(renderFeedbackCard(entry, userNames));
            });
          }

          entriesEl.innerHTML =
            '<h2 style="font-size:1rem;border:none;margin:0 0 0.75rem;padding:0;">Existing Feedback</h2>' +
            '<div class="feedback-filter-toggle">' +
              '<button class="filter-btn active" data-filter="open">Open (' + openEntries.length + ')</button>' +
              '<button class="filter-btn" data-filter="closed">Closed (' + closedEntries.length + ')</button>' +
            '</div>' +
            '<div id="feedback-list"></div>';

          renderList(openEntries);

          entriesEl.querySelector('.feedback-filter-toggle').addEventListener('click', function(e) {
            var btn = e.target.closest('.filter-btn');
            if (!btn) return;
            entriesEl.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            renderList(btn.getAttribute('data-filter') === 'closed' ? closedEntries : openEntries);
          });
        })
        .catch(function(err) {
          entriesEl.innerHTML = '<div class="feedback-empty" style="color:#c62828;">Error loading feedback: ' + escapeHtml(err.message) + '</div>';
        });
    }

    function renderFeedbackCard(entry, userNames) {
      var card = document.createElement('div');
      card.className = 'feedback-card';

      var isBug = entry.type === 'bug_report' || entry.type === 'bug';
      var typeLabel = isBug ? 'Bug' : 'Feature';
      var typeCls = isBug ? 'bug' : 'feature';
      var statusLabel = (entry.status || 'open').replace('_', ' ');

      // Status changes are admin/developer-only via API
      var statusHtml = '<span class="feedback-status-badge ' + escapeAttr(entry.status || 'open') + '">' + escapeHtml(statusLabel) + '</span>';

      var dateStr = entry.created_at || entry.submitted_at;
      var date = dateStr ? new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
      var authorId = entry.author_id || entry.submitted_by || '';
      var author = (userNames && userNames[authorId]) || authorId || 'unknown';

      var attachmentsHtml = '';
      if (entry.attachments && entry.attachments.length > 0) {
        attachmentsHtml = '<div class="feedback-card-attachments">';
        entry.attachments.forEach(function(att) {
          var url = api.getAttachmentUrl(entry.id, att.id);
          var isImage = (att.content_type || att.type || '').startsWith('image/');
          var name = att.filename || att.name || 'attachment';
          if (isImage) {
            attachmentsHtml += '<a href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer"><img class="attachment-thumb" src="' + escapeAttr(url) + '" alt="' + escapeAttr(name) + '" /></a>';
          } else {
            attachmentsHtml += '<a href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(name) + '</a>';
          }
        });
        attachmentsHtml += '</div>';
      }

      var hasResolution = entry.resolution && (entry.resolution.analysis || entry.resolution.fix);
      var chevronHtml = '';
      var resolutionHtml = '';
      if (hasResolution) {
        card.classList.add('expandable');
        chevronHtml = '<span class="feedback-chevron">&#9654;</span>';
        resolutionHtml = '<div class="feedback-resolution">';
        if (entry.resolution.analysis) {
          resolutionHtml += '<h4>Analysis</h4><p>' + escapeHtml(entry.resolution.analysis) + '</p>';
        }
        if (entry.resolution.fix) {
          resolutionHtml += '<h4>Fix</h4><p>' + escapeHtml(entry.resolution.fix) + '</p>';
        }
        resolutionHtml += '</div>';
      }

      card.innerHTML =
        '<div class="feedback-card-header">' +
          '<span class="feedback-type-badge ' + typeCls + '">' + escapeHtml(typeLabel) + '</span>' +
          statusHtml +
          '<span class="feedback-card-title">' + escapeHtml(entry.title || '') + '</span>' +
          chevronHtml +
        '</div>' +
        (entry.description ? '<div class="feedback-card-desc">' + escapeHtml(entry.description) + '</div>' : '') +
        attachmentsHtml +
        '<div class="feedback-card-meta">by ' + escapeHtml(author) + (date ? ' on ' + date : '') + '</div>' +
        resolutionHtml;

      if (hasResolution) {
        card.addEventListener('click', function() {
          card.classList.toggle('expanded');
          card.querySelector('.feedback-resolution').classList.toggle('visible');
        });
      }

      return card;
    }

    async function handleFeedbackSubmit() {
      showFeedbackFormError('');
      var title = (document.getElementById('feedback-title').value || '').trim();
      var desc = (document.getElementById('feedback-desc').value || '').trim();
      var type = document.getElementById('feedback-type').value;

      if (!title) {
        showFeedbackFormError('Title is required.');
        return;
      }
      if (!isLoggedIn()) {
        showFeedbackFormError('Please log in first.');
        return;
      }

      var entryId = 'fb_' + Date.now().toString(36);
      var btn = document.getElementById('feedback-submit-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Submitting\u2026'; }

      try {
        var feedbackData = {
          id: entryId,
          project: 'compass',
          type: type,
          author_id: currentUser ? currentUser.id : 'unknown',
          title: title,
          description: desc
        };

        await api.createFeedback(feedbackData);

        // Upload attachments
        for (var i = 0; i < feedbackSelectedFiles.length; i++) {
          await api.uploadAttachment(entryId, feedbackSelectedFiles[i]);
        }

        document.getElementById('feedback-title').value = '';
        document.getElementById('feedback-desc').value = '';
        feedbackSelectedFiles = [];
        renderFeedbackFileList();
        showFeedbackFormError('');
        if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
        loadFeedbackEntries();
      } catch (err) {
        showFeedbackFormError(err.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Submit'; }
      }
    }

      var newStatus = selectEl.value;
      selectEl.disabled = true;

      api.updateFeedback(entryId, { status: newStatus })
        .then(function() {
          selectEl.disabled = false;
        })
        .catch(function(err) {
          alert('Failed to update status: ' + err.message);
          selectEl.disabled = false;
          loadFeedbackEntries();
        });
    }

    // Real-time updates: reload store and re-render when Registry data changes
    api.subscribeToChanges(function(event) {
      // Reset the cached store promise so ensureStore() fetches fresh data
      _storeReady = loadStore(api).then(function() {
        loadFromHash();
      });
    });

    // Initial load
    updateLoginUI();
    loadFromHash();

    // Listen for hash changes
    window.addEventListener('hashchange', loadFromHash);
  </script>
</body>
</html>
